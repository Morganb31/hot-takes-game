<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151010"><title>Hot Takes | Team Battle</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#5a241b,#181011 55%,#0c0b0d);color:#fff;font:16px system-ui,-apple-system,sans-serif;min-height:100dvh}main{max-width:690px;margin:auto;padding:24px 16px 65px}.brand{text-align:center;font-size:clamp(37px,10vw,68px);font-weight:1000;letter-spacing:-2px;color:#ff772d;text-shadow:0 4px #8d2922}.sub{text-align:center;color:#fcb782;letter-spacing:3px;font-size:12px;font-weight:800;margin:0 0 28px}.panel{border:1px solid #754139;border-radius:22px;background:#24191b;padding:22px;margin:14px 0}h2{margin:0 0 15px}h3{margin:14px 0 8px}p{color:#e1c6bd;line-height:1.5}input,select{width:100%;padding:14px;border-radius:12px;background:#140f12;color:#fff;border:1px solid #875147;font:inherit;margin:6px 0}button{width:100%;border:0;border-radius:13px;background:#e85c27;color:white;padding:14px;font:inherit;font-weight:850;margin:7px 0;min-height:50px;cursor:pointer}button:disabled{opacity:.45}.red{background:#a72d2a}.orange{background:#d85a19}.outline{background:transparent;border:1px solid #b57b66}.selected{outline:3px solid #fff;outline-offset:2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{border-radius:16px;padding:14px;background:#421e1e;border:1px solid #9a3b31}.team.orangeTeam{background:#432719;border-color:#bb631e}.score{font-size:36px;font-weight:950}.label{font-size:12px;color:#ffac72;letter-spacing:1.5px;text-transform:uppercase;font-weight:900}.code{text-align:center;font-size:46px;letter-spacing:5px;color:#ff9c4e;font-weight:950}.question{font-size:clamp(25px,7vw,38px);line-height:1.2;font-weight:950;margin:24px 0}.pill{display:inline-block;padding:8px 11px;background:#50302c;border-radius:20px;margin:4px;font-weight:700}.muted{color:#c9aaa1}.small{font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.error{color:#ffb49e;text-align:center;min-height:24px}.center{text-align:center}.win{color:#ffb15d;font-size:30px;font-weight:1000}.timer{font-size:45px;text-align:center;color:#ffad61;font-weight:1000;font-variant-numeric:tabular-nums}.note{text-align:center;font-size:12px;color:#c4a7a0;margin-top:20px}
</style></head><body><main><div class="brand">HOT TAKES 🔥</div><div class="sub">TEAM BATTLE · RED VS ORANGE</div><div id="app"></div><p class="error" id="error" role="alert"></p><p class="note">Host decides the winner · Up to 30 players · Keep your tab open</p></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),app=document.getElementById('app'),error=document.getElementById('error');let session=null,state=null;const key='hotTakesTeamSession';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(s){error.textContent=s||'';}function send(event,data,cb){socket.emit(event,data,r=>{say(r?.error||'');cb?.(r);});}function act(action,extra={}){send('hostAction',{action,...extra});}
function save(r){if(!r?.ok)return;session={code:r.code,id:r.id,token:r.token};localStorage.setItem(key,JSON.stringify(session));}
function home(){app.innerHTML=`<section class="panel"><h2>WELCOME TO THE DEBATE 🔥</h2><p>Two teams. One hot take. Pick a representative and battle it out!</p><input id="nick" maxlength="20" placeholder="Your nickname"><button id="create">CREATE A ROOM</button><hr style="border:0;border-top:1px solid #694039;margin:22px 0"><input id="code" maxlength="6" inputmode="numeric" placeholder="6-digit room code"><button class="red" id="join">JOIN A ROOM</button></section>`;document.getElementById('create').onclick=()=>send('create',{name:document.getElementById('nick').value},save);document.getElementById('join').onclick=()=>send('join',{name:document.getElementById('nick').value,code:document.getElementById('code').value},save);const c=new URLSearchParams(location.search).get('room');if(c)document.getElementById('code').value=c;}
const teamTitle=t=>t==='red'?'🔴 TEAM RED':'🟠 TEAM ORANGE';const sideText=s=>s?s.toUpperCase():'NOT CHOSEN';
function render(){if(!session||!state){home();return;}const host=session.id===state.hostId,me=state.players.find(p=>p.id===session.id),myTeam=me?.team;let h=`<div class="top"><span class="label">ROOM ${esc(state.code)}</span><span class="muted small">${esc(me?.name)}${host?' 👑 HOST':''}</span></div><section class="panel"><div class="grid">${['red','orange'].map(t=>`<div class="team ${t==='orange'?'orangeTeam':''}"><div class="label">${teamTitle(t)}</div><div class="score">${state.phase==='final'&&state.finalRevealed?state.score[t]:'🔒'}</div><div class="small">${state.players.filter(p=>p.team===t).length} players</div></div>`).join('')}</div></section>`;
if(state.phase==='lobby'){h+=`<section class="panel"><h2>TEAM LOBBY</h2><div class="code">${esc(state.code)}</div><p class="center">Share the code with everyone!</p><button class="outline" id="share">COPY INVITE LINK</button><h3>Choose your team</h3><div class="grid"><button class="red ${myTeam==='red'?'selected':''}" data-team="red">🔴 JOIN RED</button><button class="orange ${myTeam==='orange'?'selected':''}" data-team="orange">🟠 JOIN ORANGE</button></div><h3>Players</h3>${state.players.map(p=>`<span class="pill" style="opacity:${p.connected?1:.5}">${esc(p.name)} ${p.team==='red'?'🔴':p.team==='orange'?'🟠':'⚪'}${p.id===state.hostId?' 👑':''}</span>`).join('')}<p>${host?'Start when both teams have at least one player.':'Waiting for the host to start.'}</p>${host?'<button id="next">START TEAM BATTLE →</button>':''}</section>`;}
else{h+=`<section class="panel"><div class="top"><span class="label">ROUND ${state.round+1}</span><span class="label">${esc(state.question?.[0])}</span></div><div class="question">${esc(state.question?.[1])}</div>`;
if(state.phase==='setup'){h+=`<div class="label center">⏱️ 1 MINUTE TO CHOOSE SIDES & REPRESENTATIVES</div><div class="timer" id="timer">1:00</div>`+`<h3>Choose debate sides</h3><p>Each team chooses Agree or Disagree. If both choose the same side, the host decides who gets which.</p><div class="grid">${['red','orange'].map(t=>`<div class="team ${t==='orange'?'orangeTeam':''}"><strong>${teamTitle(t)}</strong><p>${sideText(state.sides[t])}</p></div>`).join('')}</div>${myTeam?`<div class="grid"><button class="orange ${state.sides[myTeam]==='agree'?'selected':''}" data-side="agree">👍 AGREE</button><button class="red ${state.sides[myTeam]==='disagree'?'selected':''}" data-side="disagree">👎 DISAGREE</button></div>`:'<p>Join a team in the lobby to select a side.</p>'}<h3>Choose your representative 🎤</h3>${myTeam?`<select id="rep"><option value="">Choose a teammate</option>${state.players.filter(p=>p.team===myTeam).map(p=>`<option value="${esc(p.id)}" ${state.representatives[myTeam]===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><button class="outline" id="pick">CONFIRM REPRESENTATIVE</button>`:''}<div class="grid">${['red','orange'].map(t=>`<div class="team ${t==='orange'?'orangeTeam':''}"><div class="label">${teamTitle(t)}</div><p>🎤 ${esc(state.players.find(p=>p.id===state.representatives[t])?.name||'Not selected')}</p></div>`).join('')}</div>${host?`<h3>Host controls</h3><p class="small">If teams disagree over sides, choose which team gets Agree:</p><div class="grid"><button class="outline" data-resolve="red">RED GETS AGREE</button><button class="outline" data-resolve="orange">ORANGE GETS AGREE</button></div><button id="debate">START DEBATE 🎤</button>`:'<p>Waiting for the host to start the debate.</p>'}`;}
if(state.phase==='debate'){h+=`<div class="label center">⏱️ 2 MINUTES TO DEBATE</div><div class="timer" id="timer">2:00</div><h2 class="center">🎤 DEBATE TIME!</h2><div class="grid">${['red','orange'].map(t=>`<div class="team ${t==='orange'?'orangeTeam':''}"><strong>${teamTitle(t)}</strong><p>${sideText(state.sides[t])}</p><p>🎤 ${esc(state.players.find(p=>p.id===state.representatives[t])?.name||'Representative')}</p></div>`).join('')}</div>${host?`<h3>Who won the debate?</h3><p>Only the host can award a point.</p><div class="grid"><button class="red" data-award="red">🏆 RED WINS</button><button class="orange" data-award="orange">🏆 ORANGE WINS</button></div>`:'<p class="center">Debate in person! Waiting for the host to choose a winner.</p>'}`;}
if(state.phase==='results'){h+=`<div class="center"><div class="win">🏆 ${teamTitle(state.winner)} WINS!</div><p>One point awarded! The total score stays secret until the grand reveal.</p></div>${host?'<button id="next">NEXT HOT TAKE →</button>':'<p class="center">Waiting for the host to start the next round...</p>'}`;}
if(state.phase==='final'){h+=`<div class="center"><h2>🏆 GRAND FINALE 🏆</h2>${state.finalRevealed?`<div class="win">${state.score.red===state.score.orange?'IT’S A TIE!':teamTitle(state.score.red>state.score.orange?'red':'orange')+' WINS THE GAME!'}</div><p>🔴 Red: ${state.score.red} points · 🟠 Orange: ${state.score.orange} points</p>`:'<div class="question">WHO WON THE BATTLE? 👀</div><p>Waiting for the judge to reveal the final scores...</p>'}${host&&!state.finalRevealed?'<button id="revealFinal">🎉 REVEAL THE CHAMPIONS 🎉</button>':''}</div>`;}h+='</section>';}
if(host&&state.phase!=='lobby')h+='<button class="outline" id="end">🏁 END GAME & PREPARE GRAND REVEAL</button><button class="outline" id="reset">RESTART GAME & RESET SCORES</button>';app.innerHTML=h;
document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>send('team',{team:b.dataset.team}));document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>send('side',{side:b.dataset.side}));document.getElementById('pick')?.addEventListener('click',()=>send('representative',{id:document.getElementById('rep').value}));document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=()=>act('resolve',{team:b.dataset.resolve,side:'agree'}));document.querySelectorAll('[data-award]').forEach(b=>b.onclick=()=>{if(confirm(`Award a point to Team ${b.dataset.award.toUpperCase()}?`))act('award',{team:b.dataset.award});});document.getElementById('debate')?.addEventListener('click',()=>act('debate'));document.getElementById('next')?.addEventListener('click',()=>act('next'));document.getElementById('revealFinal')?.addEventListener('click',()=>act('revealFinal'));document.getElementById('end')?.addEventListener('click',()=>{if(confirm('End the game now? Final scores will remain hidden until you reveal them.'))act('end');});document.getElementById('reset')?.addEventListener('click',()=>{if(confirm('Reset the entire game and scores?'))act('lobby');});document.getElementById('share')?.addEventListener('click',async()=>{const msg=`Join my Hot Takes Team Battle! Room: ${state.code}\n${location.origin}/?room=${state.code}`;try{await navigator.clipboard.writeText(msg);say('Invite copied!');}catch{say(msg);}});
}
function tick(){const el=document.getElementById('timer');if(!el||!state?.deadline)return;const left=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(!left)el.style.color='#ff5555';}setInterval(tick,250);socket.on('state',s=>{state=s;render();tick();});socket.on('replaced',()=>say('This session opened on another device.'));socket.on('connect',()=>{if(session)send('resume',session,r=>{if(!r?.ok){session=null;state=null;localStorage.removeItem(key);home();}});});try{session=JSON.parse(localStorage.getItem(key));}catch{}home();
</script></body></html>
