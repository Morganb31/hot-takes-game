<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141014"><title>HOT TAKES 🔥</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#110f12}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#512017 0,#1c1114 45%,#100e11 100%)}main{max-width:650px;margin:auto;padding:24px 16px 70px}.brand{text-align:center;font-weight:1000;font-size:clamp(42px,12vw,76px);letter-spacing:-3px;line-height:1;color:#ff672d;text-shadow:0 5px 0 #801f20}.sub{text-align:center;color:#ffbd91;letter-spacing:3px;font-size:12px;font-weight:800;margin:12px 0 32px}.panel{border:1px solid #75362d;border-radius:24px;background:#21171c;padding:24px;margin:14px 0;box-shadow:0 15px 30px #0005}h2{margin:0 0 14px;font-size:24px}p{color:#dcc5c0;line-height:1.5}input{width:100%;border:1px solid #885048;border-radius:12px;padding:14px;margin:8px 0;background:#120f13;color:white;font:inherit;font-size:17px}button{font:inherit;font-weight:900;border:0;border-radius:14px;padding:15px 20px;cursor:pointer;color:white;background:#ee5c29;width:100%;margin:8px 0;min-height:52px}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#a32a29}.outline{background:transparent;border:1px solid #bd6b54}.muted{color:#bba8a7}.code{font-size:48px;font-weight:1000;letter-spacing:7px;text-align:center;color:#ff8d40}.tag{color:#ffab6c;font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:900}.question{font-size:clamp(25px,7vw,39px);font-weight:950;line-height:1.17;margin:28px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.vote{font-size:18px;min-height:95px}.vote.selected{outline:3px solid white;outline-offset:3px}.vote.disagree{background:#9c292d}.pill{display:inline-block;border-radius:50px;background:#4c2a2b;padding:8px 12px;margin:5px;font-weight:700}.pill.offline{opacity:.5}.bar{display:flex;overflow:hidden;border-radius:12px;height:22px;background:#503035;margin:16px 0}.bar .yes{background:#f36c2e}.bar .no{background:#b32a31}.voteList{display:grid;grid-template-columns:1fr 1fr;gap:12px}.voteList>div{background:#321e23;border-radius:12px;padding:12px}.voteList h3{margin:0 0 8px}.voteList p{margin:5px 0}.error{color:#ffb8a4;min-height:24px;text-align:center}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.small{font-size:13px}.hide{display:none}.note{font-size:13px;color:#bdabaa;text-align:center;margin-top:22px}
</style></head><body><main><div class="brand">HOT TAKES 🔥</div><div class="sub">AFTER DARK · PARTY EDITION</div><div id="app"></div><p id="error" class="error" role="alert"></p><div class="note">No accounts needed · Up to 30 players · Keep this tab open</div></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),app=document.getElementById('app'),error=document.getElementById('error');let session=null,state=null;const key='hotTakesSession';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function say(s){error.textContent=s||'';}function send(event,data,fn){socket.emit(event,data,r=>{if(r?.error)say(r.error);else say('');fn?.(r);});}
function home(){app.innerHTML=`<section class="panel"><h2>Enter the group chat... IRL 🔥</h2><p>Create a room or join your friends with a six-digit code.</p><input id="nick" placeholder="Your nickname" maxlength="20" autocomplete="nickname"><button id="create">CREATE ROOM</button><hr style="border:0;border-top:1px solid #57312e;margin:24px 0"><input id="room" placeholder="6-digit room code" inputmode="numeric" maxlength="6"><button class="secondary" id="join">JOIN ROOM</button></section>`;document.getElementById('create').onclick=()=>send('create',{name:document.getElementById('nick').value},save);document.getElementById('join').onclick=()=>send('join',{name:document.getElementById('nick').value,code:document.getElementById('room').value},save);}
function save(r){if(!r?.ok)return;session={code:r.code,id:r.id,token:r.token};localStorage.setItem(key,JSON.stringify(session));}
function action(a){send('hostAction',{action:a});}
function render(){if(!session||!state){home();return;}const host=state.hostId===session.id,me=state.players.find(p=>p.id===session.id),myVote=state.votes.find(v=>v.id===session.id)?.vote,agree=state.votes.filter(v=>v.vote==='agree'),disagree=state.votes.filter(v=>v.vote==='disagree'),total=state.votes.length,pct=total?Math.round(agree.length/total*100):0;
 let html=`<div class="topline"><span class="tag">ROOM ${esc(state.code)}</span><span class="muted small">${esc(me?.name||'Player')}${host?' · HOST':''}</span></div>`;
 if(state.phase==='lobby'){html+=`<section class="panel"><h2>THE LOBBY 🔥</h2><div class="code">${esc(state.code)}</div><p style="text-align:center">Share this code and the website link with your friends.</p><button class="outline" id="share">COPY INVITE</button><h2>Players (${state.players.length})</h2>${state.players.map(p=>`<span class="pill ${p.connected?'':'offline'}">${esc(p.name)}${p.id===state.hostId?' 👑':''}</span>`).join('')}<p>${host?'Start whenever everyone has joined.':'Waiting for the host to start...'}</p>${host?'<button id="next">START GAME →</button>':''}</section>`;}
 else{html+=`<section class="panel"><div class="topline"><span class="tag">ROUND ${state.round+1}</span><span class="tag">${esc(state.question?.[0]||'')}</span></div><div class="question">${esc(state.question?.[1]||'')}</div>`;
 if(state.phase==='voting'){html+=`<div class="grid"><button class="vote ${myVote==='agree'?'selected':''}" data-vote="agree">👍 AGREE</button><button class="vote disagree ${myVote==='disagree'?'selected':''}" data-vote="disagree">👎 DISAGREE</button></div><p style="text-align:center">${total} of ${state.players.filter(p=>p.connected).length} connected players voted</p><p class="small" style="text-align:center">${myVote?'Your vote is in! You can change it until results are revealed.':'Choose your side!'}</p>${host?'<button class="outline" id="reveal">REVEAL RESULTS</button>':''}`;}
 else{html+=`<h2>THE VERDICT 👀</h2><div class="topline"><strong>👍 ${pct}% AGREE</strong><strong>👎 ${100-pct}% DISAGREE</strong></div><div class="bar"><div class="yes" style="width:${pct}%"></div><div class="no" style="width:${100-pct}%"></div></div><div class="voteList"><div><h3>👍 Agree (${agree.length})</h3>${agree.map(v=>`<p>${esc(v.name)}</p>`).join('')||'<p class="muted">Nobody</p>'}</div><div><h3>👎 Disagree (${disagree.length})</h3>${disagree.map(v=>`<p>${esc(v.name)}</p>`).join('')||'<p class="muted">Nobody</p>'}</div></div><p>${state.players.length-total} did not vote.</p>${host?'<button id="next">NEXT HOT TAKE →</button>':'<p>Waiting for the host to start the next round...</p>'}`;}
 html+='</section>';}
 if(host&&state.phase!=='lobby')html+='<button class="outline" id="reset">BACK TO LOBBY / RESTART</button>';
 app.innerHTML=html;
 document.getElementById('next')?.addEventListener('click',()=>action('next'));document.getElementById('reveal')?.addEventListener('click',()=>action('reveal'));document.getElementById('reset')?.addEventListener('click',()=>{if(confirm('Restart the game for everyone?'))action('lobby');});document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>send('vote',{vote:b.dataset.vote}));document.getElementById('share')?.addEventListener('click',async()=>{const link=location.origin+'/?room='+state.code;try{await navigator.clipboard.writeText(`Join my Hot Takes game! Room code: ${state.code}\n${link}`);say('Invite copied!');}catch{say(`Share this link: ${link}`);}});
}
socket.on('state',s=>{state=s;render();});socket.on('replaced',()=>say('Your session was opened on another device.'));
socket.on('connect',()=>{if(session)send('resume',session,r=>{if(!r?.ok){session=null;state=null;localStorage.removeItem(key);home();}});});
try{session=JSON.parse(localStorage.getItem(key));}catch{}home();const roomParam=new URLSearchParams(location.search).get('room');if(roomParam&&/^\d{6}$/.test(roomParam)){setTimeout(()=>{const field=document.getElementById('room');if(field)field.value=roomParam;},0);}
</script></body></html>
